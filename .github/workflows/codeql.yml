name: CodeQL

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    # Weekly, so new queries reach the repo without waiting for a code change.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Vue SFC script blocks are covered by the JS/TS extractor.
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - coverage/**
              - '**/dist/**'
              - '**/test-results/**'
              - '**/playwright-report/**'

      # No build step: the JS/TS extractor does not compile, and the Vite build
      # would add nothing to the database.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
